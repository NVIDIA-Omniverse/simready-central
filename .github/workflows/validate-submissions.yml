name: Validate submissions

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-submission-files:
    name: Validate submission files
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the proposed commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Validate changed submission files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          REVIEW_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Comparing PR head $HEAD_SHA with review base $REVIEW_BASE"
          python3 .github/scripts/validate_submissions.py \
            "$REVIEW_BASE" "$HEAD_SHA" \
            --output-directory submission-diff

      - name: Upload added and removed package lists
        uses: actions/upload-artifact@v4
        with:
          name: submission-package-diff
          path: submission-diff/
          if-no-files-found: error
          retention-days: 14

      - name: Report successful submission checks
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- simready-submission-validation -->";
            const body = `${marker}\nSubmission checks completed. Added and removed package lists are available in the **submission-package-diff** workflow artifact.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

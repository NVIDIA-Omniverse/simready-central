name: Test submission validator

on:
  pull_request:
    paths:
      - .github/scripts/validate_submissions.py
      - .github/workflows/test-validate-submissions.yml
      - tests/test_validate_submissions.py
  push:
    paths:
      - .github/scripts/validate_submissions.py
      - .github/workflows/test-validate-submissions.yml
      - tests/test_validate_submissions.py

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run validator integration tests
        run: python3 -m unittest discover -s tests -p 'test_validate_submissions.py' -v
